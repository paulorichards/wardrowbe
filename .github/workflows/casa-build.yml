# casa-build — construye las imágenes que corre el NAS desde la rama `casa`.
#
# Tags publicados en ghcr.io/paulorichards/wardrowbe:
#   backend-1.12.0-casa.N / frontend-1.12.0-casa.N   ← los que fija nas-gitops
#   backend-casa / frontend-casa                     ← flotantes, para probar
# 1.12.0 sale de .casa/base (el release de upstream debajo de casa) y N es el
# número de corrida, siempre creciente: Renovate ordena por él.
#
# Sólo linux/amd64: el NAS es un J3455. Sin despliegue automático: Renovate
# abre el PR en nas-gitops y las migraciones se corren a mano (ver su README).
name: casa-build

on:
  push:
    branches: [casa]
  workflow_dispatch:

concurrency:
  group: casa-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Los mismos tests de backend que el ci.yml de upstream: si un parche nuestro
  # rompe algo, no sale imagen.
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/wardrobe_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          STORAGE_PATH: /tmp/wardrobe
        run: pytest -q --tb=short

  build:
    needs: backend-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: v
        run: |
          base="$(cat .casa/base)"
          version="${base#wardrowbe-v}"
          echo "tag=${{ matrix.service }}-${version}-casa.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=casa-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=casa-${{ matrix.service }}

      # Igual que upstream: el modelo de rembg horneado tiene que cargar sin red.
      - name: rembg carga offline
        if: matrix.service == 'backend'
        run: backend/scripts/check_rembg_image.sh "${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}"

      - name: Push
        run: |
          img="${{ steps.v.outputs.image }}"
          docker tag "$img:${{ steps.v.outputs.tag }}" "$img:${{ matrix.service }}-casa"
          docker push "$img:${{ steps.v.outputs.tag }}"
          docker push "$img:${{ matrix.service }}-casa"
          echo "Publicado \`$img:${{ steps.v.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  avisar-falla:
    needs: [backend-test, build]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "casa-build falló en $(echo "$GITHUB_SHA" | cut -c1-7)" \
            --body "No salió imagen nueva; el NAS sigue en la anterior. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
